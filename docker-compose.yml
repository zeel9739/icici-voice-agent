version: "3.8"

services:

  # ── FastAPI REST API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: runtime
    expose:
      - "8000"
    env_file: ./backend/.env
    volumes:
      - db_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LiveKit Voice Agent worker ───────────────────────────────────────────────
  agent:
    build:
      context: ./backend
      target: runtime
    env_file: ./backend/.env
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.agent.worker start
    restart: always

  # ── React frontend served by Nginx (port 80) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:

[tool.poetry]
name = "icici-voice-agent"
version = "0.1.0"
description = "ICICI Prudential AMC Lead Qualification Voice Bot"
authors = ["Zeel Bharodiya <himaybharoliya0@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "0.111.0"
uvicorn = { extras = ["standard"], version = "0.29.0" }
livekit-agents = "^1.5.9"
livekit-plugins-deepgram = "^1.5.9"
livekit-plugins-groq = "^1.5.9"
livekit-plugins-silero = "^1.5.9"
livekit-plugins-cartesia = "^1.5.9"
pydantic = "2.7.1"
pydantic-settings = "2.2.1"
SQLAlchemy = { extras = ["asyncio"], version = "2.0.30" }
aiosqlite = "^0.20.0"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
python-dotenv = "1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-dotenv = "^0.5.2"
httpx = "^0.27.0"

[tool.poetry.scripts]
start-api = "app.main:start"
start-agent = "app.agent.worker:start"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env_files = [".env.test"]   # loaded by pytest-dotenv before any test runs

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
